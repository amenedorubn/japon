<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Japón 2027 · v3 (en construcción)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{
    --bg:#f7f5f0; --card:#ffffff; --ink:#1c1a17; --muted:#6b675f;
    --line:#e3ded3; --accent:#b23a2e; --warn:#a9670d; --ok:#3a7d44;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#15130f; --card:#211e19; --ink:#efece5; --muted:#a49d8d;
      --line:#3a352c; --accent:#e2685a; --warn:#e0a03c; --ok:#6fbf7a;
    }
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    padding:0 12px 40px; max-width:560px; margin-inline:auto;
  }
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 4px; position:sticky; top:0; background:var(--bg); z-index:2;
  }
  header nav a{color:var(--muted); font-size:.8rem; text-decoration:none; margin-left:10px;}
  header nav a.activo{color:var(--accent); font-weight:600;}
  h1{font-size:1.05rem; margin:0;}
  .sub{color:var(--muted); font-size:.78rem; margin:2px 0 0;}

  #mapa{height:220px; border-radius:12px; margin:6px 0 4px; border:1px solid var(--line);}
  .mapa-selector{font:inherit; font-size:.82rem; padding:6px 8px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); width:100%; margin-bottom:8px;}

  .base{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px;}
  .base h2{font-size:1rem; margin:0 0 2px;}
  .base .meta{font-size:.78rem; color:var(--muted); margin:0 0 10px;}
  .dia{margin-bottom:10px;}
  .dia h3{font-size:.82rem; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; margin:0 0 6px;}
  .parada{display:flex; gap:8px; align-items:baseline; padding:4px 0; font-size:.9rem; border-bottom:1px dashed var(--line);}
  .parada:last-child{border-bottom:none;}
  .parada .icono{flex-shrink:0;}
  .parada .hora{color:var(--muted); font-size:.78rem; flex-shrink:0; width:38px;}
  .parada .nombre{overflow-wrap:anywhere;}
  .parada.trayecto{font-weight:600;}
  details.sinbase{margin-top:16px;}
  details.sinbase summary{color:var(--warn); font-size:.85rem; cursor:pointer;}
  .empty, .devnote{text-align:center; color:var(--muted); padding:40px 12px; font-size:.9rem;}
  .devnote code{background:var(--card); padding:1px 5px; border-radius:4px;}
</style>
</head>
<body>
  <header>
    <div>
      <h1>Japón 2027 · Ruta</h1>
      <p class="sub">v3 · en construcción</p>
    </div>
    <nav><a href="./index.html">Pendientes</a><a href="./ruta.html" class="activo">Ruta</a></nav>
  </header>

  <select id="mapaSelector" class="mapa-selector"></select>
  <div id="mapa"></div>

  <main id="app">
    <p class="sub">Cargando…</p>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="./lib/timezone.js"></script>
  <script src="./lib/model.js"></script>
  <script src="./lib/storage.js"></script>
  <script src="./lib/hecho-overrides.js"></script>
  <script src="./lib/bases.js"></script>
  <script>
    'use strict';
    var storage = makeStorage(window.localStorage);
    var app = document.getElementById('app');
    var mapaSelector = document.getElementById('mapaSelector');
    var mapa = null, mapaLayer = null;

    var MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
    function diaCorto(fechaISO){ var p = fechaISO.split('-'); return parseInt(p[2], 10) + ' ' + MESES[parseInt(p[1], 10) - 1]; }

    function esc(s){
      return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    // Estado visible por elemento (Decisión 2026-09-16 punto 2): una
    // reserva pendiente (necesaria y no hecha) manda sobre el estado base.
    function tienePendiente(item){
      return (item.acciones || []).some(function(a){ return a.necesaria && !a.hecho; });
    }
    function iconoEstado(item){
      if (tienePendiente(item)) return '🎫';
      return item.estado === 'confirmado' ? '✅' : '🟡';
    }

    function horaDe(item){
      var inicio = item.fechaHora && item.fechaHora.inicio;
      if (!inicio || inicio.indexOf('T') === -1) return '';
      return inicio.split('T')[1].slice(0, 5);
    }

    function paradaHTML(item){
      return '<div class="parada' + (item.tipo === 'trayecto' ? ' trayecto' : '') + '">' +
        '<span class="icono">' + iconoEstado(item) + '</span>' +
        '<span class="hora">' + esc(horaDe(item)) + '</span>' +
        '<span class="nombre">' + esc(item.nombre) + '</span>' +
        '</div>';
    }

    function baseHTML(base){
      var etiquetaCiudad = base.ciudadBase ? base.ciudadBase + ' · ' : '';
      var rango = diaCorto(base.checkIn) + '–' + diaCorto(base.checkOut);
      var diasHTML = Object.keys(base.dias).sort().map(function(fecha){
        return '<div class="dia"><h3>' + diaCorto(fecha) + '</h3>' +
          base.dias[fecha].map(paradaHTML).join('') + '</div>';
      }).join('');
      return '<section class="base">' +
        '<h2>' + esc(etiquetaCiudad + base.hotelNombre) + '</h2>' +
        '<p class="meta">' + base.noches.length + (base.noches.length === 1 ? ' noche · ' : ' noches · ') + rango + '</p>' +
        diasHTML +
        '</section>';
    }

    function pinIconFor(item){
      var color = item.tipo === 'trayecto' ? '#6b675f' : (item.estado === 'confirmado' ? '#3a7d44' : '#b23a2e');
      return L.divIcon({
        className: '', html: '<div style="width:12px;height:12px;border-radius:50%;background:' + color + ';border:2px solid white;box-shadow:0 0 2px rgba(0,0,0,.5);"></div>',
        iconSize: [12, 12], iconAnchor: [6, 6]
      });
    }

    function renderMapa(items){
      var conUbicacion = items.filter(function(it){ return it.ubicacion; });
      if (!mapa) {
        mapa = L.map('mapa', { zoomControl: false });
        // PRUEBA (2026-09-16): las teselas de CARTO que usa v2.1 ahora piden
        // API key (carto.com/basemaps/apikey) — parece un cambio de política
        // de CARTO, no algo de este proyecto; hay que avisar de esto en
        // v2.1 aparte. Aquí, mientras tanto, Esri World Street Map: sin
        // API key, con nombres en alfabeto latino/rōmaji.
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
          maxZoom: 19,
          attribution: '&copy; <a href="https://www.esri.com">Esri</a>'
        }).addTo(mapa);
      }
      if (mapaLayer) mapa.removeLayer(mapaLayer);
      mapaLayer = L.layerGroup(conUbicacion.map(function(it){
        return L.marker([it.ubicacion.lat, it.ubicacion.lng], { icon: pinIconFor(it) }).bindPopup(esc(it.nombre));
      })).addTo(mapa);
      mapa.invalidateSize(); // el contenedor puede haber cambiado de tamaño/visibilidad entre bases
      if (conUbicacion.length) {
        mapa.fitBounds(L.latLngBounds(conUbicacion.map(function(it){ return [it.ubicacion.lat, it.ubicacion.lng]; })).pad(0.2), { maxZoom: 16 });
      } else {
        mapa.setView([35.68, 139.76], 10); // Tokio, sin pines que enmarcar
      }
    }

    function renderView(bases, sinBase){
      var html = bases.map(baseHTML).join('');
      if (sinBase.length) {
        html += '<details class="sinbase" open><summary>⚠️ Sin base confirmada (' + sinBase.length + ')</summary>' +
          sinBase.map(paradaHTML).join('') + '</details>';
      }
      app.innerHTML = html || '<p class="empty">Nada que mostrar todavía.</p>';

      mapaSelector.innerHTML = bases.map(function(b, i){
        return '<option value="' + i + '">' + esc((b.ciudadBase ? b.ciudadBase + ' · ' : '') + b.hotelNombre) + '</option>';
      }).join('');
      mapaSelector.addEventListener('change', function(){
        const b = bases[Number(mapaSelector.value)];
        const items = Object.keys(b.dias).reduce(function(acc, f){ return acc.concat(b.dias[f]); }, []);
        renderMapa(items);
      });
      if (bases.length) {
        mapaSelector.value = '0';
        const primera = Object.keys(bases[0].dias).reduce(function(acc, f){ return acc.concat(bases[0].dias[f]); }, []);
        renderMapa(primera);
      }
    }

    function renderSinDatos(){
      app.innerHTML = '<div class="devnote">' +
        '<p><strong>Modo desarrollo: sin datos</strong></p>' +
        '<p>No se encontró <code>import/v3-migrated-preview.json</code>. Genera un volcado con ' +
        '<code>node tools/v3-migrate-import.js live.json</code> y sirve el repo con ' +
        '<code>.claude/serve.ps1</code>.</p>' +
        '</div>';
      mapaSelector.innerHTML = '';
      document.getElementById('mapa').style.display = 'none';
    }

    fetch('../import/v3-migrated-preview.json')
      .then(function(res){ if (!res.ok) throw new Error('sin datos'); return res.json(); })
      .then(function(itemsRaw){
        var overrides = storage.getJSON('hechoOverrides', {});
        var items = applyOverrides(itemsRaw, overrides);
        var hoteles = items.filter(function(it){ return it.tipo === 'alojamiento' && it.estado === 'confirmado'; });
        var resto = items.filter(function(it){ return it.tipo !== 'alojamiento'; });
        var r = buildBases(hoteles, resto);
        var basesConCiudad = r.bases.map(function(b){
          var hotel = hoteles.find(function(h){ return h.id === b.hotelId; });
          return Object.assign({}, b, { ciudadBase: hotel ? hotel.ciudadBase : null });
        });
        renderView(basesConCiudad, r.sinBase);
      })
      .catch(function(){ renderSinDatos(); });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js', { scope: './' });
    }
  </script>
</body>
</html>
