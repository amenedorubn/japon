<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Japón 2027 · v3 (en construcción)</title>
<!-- Fase 7: manifest y start_url/scope propios de v3 (/japon/v3/), a
     propósito DISTINTOS de los de v2.1 -- instalar v3 no debe sustituir ni
     redirigir a la app ya instalada. Icono con la marca "v3" visible
     mientras conviven; V3-DESIGN.md anota unificarlo con el de v2.1 en la
     Fase 8. -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#f6f4ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Japón 27 · v3">
<link rel="apple-touch-icon" href="./icon-any.png">
<script src="./lib/storage.js"></script>
<script>
(function(){
  // Tema antes de pintar (mismo mecanismo que v2.1, clave propia de v3 --
  // jp27v3:theme -- para no pisar japon27_theme, PROJECT.md §12.8). Pasa por
  // el wrapper de storage.js, no por localStorage directo: lo exige
  // tests/test-v3-storage-guard.js, así que storage.js se carga aquí antes
  // que nada más.
  try{
    var storage = makeStorage(window.localStorage);
    var saved = storage.get('theme');
    var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  }catch(e){ document.documentElement.setAttribute('data-theme', 'light'); }
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Serif+JP:wght@600;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{
    /* Fase 7: paleta calcada de v2.1 (index.html raíz) para unificar el
       sistema visual entre ambas apps mientras coexisten. */
    --bg:#f6f4ee; --card:#fffefb; --ink:#26221a; --muted:#6d6557;
    --line:#e7e2d4; --accent:#bf3823; --warn:#a07310; --ok:#38724f;
    --shadow:0 1px 2px rgba(46,36,16,.05),0 6px 20px rgba(46,36,16,.06);
    --radius:16px; --radius-s:10px;
    --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    --serif:'Noto Serif JP',serif;
    --menu-bg:#1c1a17; --menu-ink:#efece5; --menu-muted:#a49d8d; --menu-active:#e2685a;
  }
  /* Mismo mecanismo que v2.1: data-theme lo fija el script de <head> ANTES
     de pintar (guardado, o preferencia de sistema si no hay nada guardado
     todavía) -- sin depender solo de @media, para que el interruptor manual
     del menú pueda anular la preferencia de sistema. */
  :root[data-theme="dark"]{
    --bg:#131217; --card:#1c1b22; --ink:#ece7db; --muted:#a49d8e;
    --line:#2e2c37; --accent:#cf4530; --warn:#d3a53a; --ok:#72b18e;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 20px rgba(0,0,0,.3);
  }
  :root[data-theme="dark"] .leaflet-container{filter:brightness(.9) saturate(.9);}
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font);}

  header{
    display:flex; align-items:center; gap:10px; padding:14px 16px;
    position:sticky; top:0; background:var(--bg); z-index:5; border-bottom:1px solid var(--line);
  }
  #btnMenu{font-size:1.3rem; line-height:1; background:none; border:none; cursor:pointer; padding:4px 8px; border-radius:8px; color:var(--ink);}
  #btnMenu:hover{background:var(--line);}
  header h1{font-size:1rem; margin:0; font-family:var(--serif); font-weight:700;}
  header .sub{font-size:.76rem; color:var(--muted); margin:0;}

  /* Bloque 2 (2026-09-16): el menú SIEMPRE por encima del mapa (Leaflet usa
     z-index 400-1000 en sus propios panes/controles) — con 2000 sobra de
     margen para no depender de sutilezas del contexto de apilamiento. */
  #overlay{ position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:2000; opacity:0; pointer-events:none; transition:opacity .2s; }
  #overlay.abierto{opacity:1; pointer-events:auto;}
  #menu{
    position:fixed; top:0; bottom:0; left:0; width:82%; max-width:320px;
    background:var(--menu-bg); color:var(--menu-ink); z-index:2001;
    transform:translateX(-100%); transition:transform .25s ease; overflow-y:auto; padding:20px 0 40px;
  }
  #menu.abierto{transform:translateX(0);}
  #menu .cabecera{padding:0 20px 16px; font-size:1.3rem; font-weight:700; border-bottom:1px solid #3a352c; margin-bottom:8px;}
  #menu .seccion > button{
    width:100%; text-align:left; background:none; border:none; color:var(--menu-ink);
    font:inherit; font-size:1rem; padding:14px 20px; cursor:pointer; display:flex; justify-content:space-between; align-items:center;
  }
  #menu .seccion > button:hover{background:#2a271f;}
  #menu .seccion > button.activo{color:var(--menu-active);}
  #menu .base-header{padding:10px 20px 4px; font-size:.72rem; text-transform:uppercase; letter-spacing:.04em; color:var(--menu-muted);}
  #menu .dia-chip{
    display:block; width:100%; text-align:left; padding:8px 20px 8px 32px; font-size:.9rem; color:var(--menu-ink);
    background:none; border:none; font:inherit; cursor:pointer; border-left:3px solid transparent;
  }
  #menu .dia-chip:hover{background:#2a271f;}
  #menu .dia-chip.activo{border-left-color:var(--menu-active); color:var(--menu-active); font-weight:600; background:#2a271f;}
  #menu .dia-chip .ciudad{color:var(--menu-muted); font-weight:400;}
  #menu .dia-chip.activo .ciudad{color:var(--menu-active);}

  main{max-width:520px; margin-inline:auto; padding:0 12px 40px;}
  section{margin-top:18px;}
  section > h2{font-size:.82rem; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:0 0 8px 4px;}

  /* --- Pendientes --- */
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:8px; display:flex; align-items:stretch; overflow:hidden;}
  .card-left{flex:3 1 0; min-width:0; padding:10px 12px;}
  .card-right{flex:1 1 0; min-width:72px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:8px 6px; border-left:1px solid var(--line);}
  .card h3{margin:0 0 4px; font-size:.95rem; overflow-wrap:anywhere;}
  .tramos{margin:2px 0 6px; padding:0; list-style:none; font-size:.82rem; color:var(--muted);}
  .tramos li{overflow-wrap:anywhere;}
  .badge{display:inline-flex; align-items:center; gap:4px; font-size:.72rem; padding:2px 7px; border-radius:999px; border:1px solid var(--line); margin-bottom:6px;}
  .badge.warn{color:var(--warn); border-color:var(--warn);}
  .badge.watch{color:var(--muted); border-color:var(--line);}
  .regla{font-size:.78rem; color:var(--muted); margin:2px 0 8px;}
  .actions{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;}
  .countdown-big{font-size:1.7rem; font-weight:700; line-height:1.05; white-space:nowrap;}
  .countdown-unit{font-size:.7rem; color:var(--muted); display:block;}
  .fecha-corta{font-size:.76rem; color:var(--muted); margin-top:6px; max-width:100%; overflow-wrap:break-word;}
  .fecha-corta.warn{color:var(--warn);}
  .fecha-corta.hora-linea{margin-top:0;}
  .hora-jst{font-size:.66rem; color:var(--muted); opacity:.8; margin-top:2px; max-width:100%; overflow-wrap:break-word;}
  .hora-jst.hora-linea{margin-top:0;}
  button, a.btn{font:inherit; font-size:.78rem; padding:5px 10px; border-radius:8px; border:1px solid var(--line); background:transparent; color:var(--ink); cursor:pointer; text-decoration:none; display:inline-block;}
  button.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  button.link{border:none; padding:2px 0; text-decoration:underline; color:var(--accent);}
  details{margin-top:18px;}
  summary{cursor:pointer; color:var(--muted); font-size:.85rem;}
  .hecho-row{display:flex; justify-content:space-between; align-items:center; padding:6px 4px; font-size:.85rem;}
  .empty, .devnote, .placeholder{text-align:center; color:var(--muted); padding:40px 12px; font-size:.9rem;}
  .devnote code{background:var(--card); padding:1px 5px; border-radius:4px;}
  .toast{position:fixed; left:12px; right:12px; bottom:16px; max-width:496px; margin-inline:auto; background:var(--ink); color:var(--bg); border-radius:10px; padding:10px 14px; display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:.85rem; z-index:6;}
  .toast button{border-color:var(--bg); color:var(--bg);}

  /* --- Día (Ruta) --- */
  .dia-header{padding:16px 4px 12px; border-bottom:1px solid var(--line); margin-bottom:14px;}
  .dia-header .fecha{font-size:1.3rem; font-weight:700; margin:0; font-family:var(--serif);}
  .dia-header .base{font-size:.88rem; color:var(--muted); margin:4px 0 0; display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  /* Bloque 2: el mapa vive DENTRO del contenido del día, en flujo normal
     (nada de fixed/sticky), y se destruye por completo al salir de aquí. */
  #mapaDia{height:200px; border-radius:12px; margin-bottom:16px; border:1px solid var(--line);}
  .agenda{position:relative;}
  .bloque{display:flex; gap:10px; margin-bottom:2px; padding:10px 0; border-bottom:1px dashed var(--line);}
  .bloque:last-child{border-bottom:none;}
  .bloque .franja{flex-shrink:0; width:56px; text-align:right; font-size:.8rem; color:var(--muted); padding-top:2px;}
  .bloque .franja .dur{display:block; font-size:.68rem; opacity:.8;}
  .bloque .cuerpo{flex:1; min-width:0;}
  .bloque .cuerpo h3{margin:0; font-size:.94rem; display:flex; align-items:center; gap:6px;}
  .bloque .cuerpo .num{display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px; border-radius:50%; background:var(--line); font-size:.68rem; flex-shrink:0;}
  .bloque .cuerpo p{margin:2px 0 0; font-size:.82rem; color:var(--muted);}
  .bloque.transporte{background:var(--card); border-radius:10px; padding:10px 12px; border-bottom:none; margin-bottom:10px; border:1px solid var(--line);}
  .bloque.transporte .cuerpo h3{font-weight:700;}
  .bloque.hito{background:var(--card); border-radius:10px; padding:10px 12px; border-bottom:none; margin-bottom:10px; border:1px dashed var(--line);}
  .bloque.hito .cuerpo h3{font-weight:700; color:var(--muted);}
  .bloque.hueco{background:var(--card); border-radius:10px; padding:10px 12px; border-bottom:none; margin-bottom:10px; border:1px dashed var(--warn);}
  .bloque.hueco .cuerpo h3{font-weight:700; color:var(--warn);}
  .badge.tag{color:var(--warn); border-color:var(--warn);}
  .detalle{display:none; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px; margin-top:6px; font-size:.85rem;}
  .detalle.abierto{display:block;}
  .bloque.clicable{cursor:pointer;}
  .nota-final{font-size:.78rem; color:var(--muted); background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-top:14px;}

  /* --- Reservas (Fase 5) --- */
  .reservar-box{margin-top:8px; display:flex; flex-direction:column; gap:6px; max-width:100%;}
  .nota-input{font:inherit; font-size:.82rem; padding:6px 8px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink); max-width:100%;}
  /* Fase 5b, punto 3: mismo lenguaje visual que .dia-chip del menú (píldora
     tappable, estado activo con el acento de la app) adaptado a una fila
     que envuelve en vez de una lista vertical. */
  .filtro-reservas{display:flex; gap:8px; flex-wrap:wrap; margin:4px 0 16px;}
  .filtro-chip{font:inherit; font-size:.82rem; padding:7px 12px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; white-space:nowrap;}
  .filtro-chip.activo{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600;}

  /* --- Más: filtros + lista de Ideas (Fase 5) --- */
  .filtros{display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 12px;}
  .filtros select{font:inherit; font-size:.82rem; padding:6px 8px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); max-width:100%;}
  .ideas-lista{display:flex; flex-direction:column;}
  .idea-row{padding:8px 4px; border-bottom:1px dashed var(--line); display:flex; flex-direction:column; gap:2px;}
  .idea-row:last-child{border-bottom:none;}
  .idea-nombre{font-size:.9rem; font-weight:600; overflow-wrap:anywhere;}
  .idea-meta{font-size:.76rem; color:var(--muted);}

  /* --- Más: Guía (Fase 5, horneada de v2.1) --- */
  .tip-card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px;}
  .tip-card p{margin:4px 0 0; font-size:.85rem; color:var(--muted);}
  .tip-card small{color:var(--muted); font-weight:400;}
  .guia-row{display:flex; gap:10px; align-items:flex-start; padding:8px 0; border-bottom:1px dashed var(--line);}
  .guia-row:last-child{border-bottom:none;}
  .guia-row .precio{flex:none; min-width:96px; font-weight:700; color:var(--accent); font-size:.85rem;}
  .guia-row small{display:block; color:var(--muted); font-size:.78rem;}
  .phrases-table{width:100%; border-collapse:collapse; font-size:.88rem;}
  .phrases-table td{padding:6px 4px; border-bottom:1px dashed var(--line); overflow-wrap:anywhere; vertical-align:top;}
  .phrases-table td.romaji{color:var(--muted); font-size:.8rem;}

  /* --- Ficha de detalle (Fase 5b): hoja inferior, un único sitio para toda
     la app (Ruta/Reservas/Ideas/Pendientes) --- */
  .titulo-ficha{cursor:pointer; text-decoration:underline; text-decoration-color:var(--line); text-underline-offset:3px;}
  #fichaOverlay{position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:2500; opacity:0; pointer-events:none; transition:opacity .2s;}
  #fichaOverlay.abierto{opacity:1; pointer-events:auto;}
  #fichaSheet{
    position:fixed; left:0; right:0; bottom:0; max-height:82vh; overflow-y:auto;
    background:var(--card); z-index:2501; border-radius:16px 16px 0 0;
    box-shadow:0 -4px 24px rgba(0,0,0,.25);
    transform:translateY(100%); transition:transform .25s ease;
    padding:16px 16px calc(20px + env(safe-area-inset-bottom, 0px));
  }
  #fichaSheet.abierto{transform:translateY(0);}
  #btnCerrarFicha{position:sticky; top:0; float:right; background:var(--card); border:none; font-size:1.1rem; line-height:1; cursor:pointer; color:var(--muted); padding:6px 8px; border-radius:8px;}
  .ficha h2{margin:4px 0 6px; font-size:1.15rem; padding-right:34px; overflow-wrap:anywhere;}
  .ficha .badges{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; clear:both;}
  .ficha .campo{margin:10px 0;}
  .ficha .campo b{display:block; font-size:.7rem; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); margin-bottom:2px;}
  .ficha .campo p{margin:0; font-size:.9rem; overflow-wrap:anywhere;}
  .ficha .enlaces{display:flex; gap:8px; flex-wrap:wrap; margin:12px 0;}
  .ficha .fuente-bloque{border-top:1px dashed var(--line); margin-top:14px; padding-top:10px;}
  .ficha .fuente-bloque h4{margin:0 0 4px; font-size:.8rem; color:var(--muted); text-transform:uppercase; letter-spacing:.03em;}

  /* --- Fase 6: puerta de acceso --- */
  #authGate{min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px 16px;}
  .auth-card{max-width:340px; width:100%; text-align:center;}
  .auth-logo{font-size:2.4rem; margin-bottom:6px; font-family:var(--serif); color:var(--accent);}
  .auth-card h1{font-size:1.25rem; margin:0 0 22px; font-family:var(--serif);}
  .auth-google{display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:12px 16px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); font:inherit; font-size:.92rem; cursor:pointer;}
  .auth-google svg{width:20px; height:20px; flex-shrink:0;}
  .auth-error{color:var(--accent); font-size:.82rem; margin-top:12px;}
  .auth-status-msg{font-size:.9rem; color:var(--muted); line-height:1.5;}
  .auth-actions{display:flex; gap:8px; justify-content:center; margin-top:16px; flex-wrap:wrap;}
  .btn.ghost{background:transparent;}

  /* --- Fase 7: pie del menú (tema + cerrar sesión) --- */
  #menu .menu-pie{border-top:1px solid #3a352c; margin-top:12px; padding-top:4px;}
  #menu .menu-pie button{
    width:100%; text-align:left; background:none; border:none; color:var(--menu-muted);
    font:inherit; font-size:.88rem; padding:12px 20px; cursor:pointer; display:flex; align-items:center; gap:6px;
  }
  #menu .menu-pie button:hover{background:#2a271f; color:var(--menu-ink);}

  /* --- Fase 7: indicador discreto de estado (offline / cambios sin
       sincronizar) -- oculto por defecto, visible solo cuando hay algo que
       avisar. --- */
  #estadoConexion{font-size:.74rem; color:var(--muted); background:var(--card); text-align:center; padding:5px 10px; border-bottom:1px solid var(--line);}
  #estadoConexion[hidden]{display:none;}

  /* --- Fase 7: mapa offline -- si no hay red y falta alguna tesela sin
       cachear, aviso claro en vez de cuadrícula gris. --- */
  .mapa-offline-aviso{background:var(--card); border:1px solid var(--warn); color:var(--warn); border-radius:var(--radius-s); padding:8px 12px; font-size:.8rem; margin-bottom:10px;}
</style>
</head>
<body>
  <!-- Fase 6: puerta de acceso (Google Sign-In, mismo proyecto/nodo de
       aprobación que v2.1 -- v3 nunca escribe ahí, solo lee). El resto de
       la app (#appRoot) está oculto hasta que resolverAcceso() confirme
       'approved'. -->
  <div id="authGate">
    <div class="auth-card">
      <div class="auth-logo">🇯🇵</div>
      <h1>Japón 2027</h1>
      <div id="authBody"><p class="auth-status-msg">Cargando…</p></div>
    </div>
  </div>

  <div id="appRoot" style="display:none">
    <header>
      <button id="btnMenu" aria-label="Abrir menú">🇯🇵</button>
      <div>
        <h1 id="tituloPantalla">Japón 2027 · Pendientes</h1>
        <p class="sub">v3 · en construcción</p>
      </div>
    </header>
    <div id="estadoConexion" hidden></div>

    <div id="overlay"></div>
    <nav id="menu">
      <div class="cabecera">🇯🇵 Japón 2027</div>
      <div class="seccion"><button id="btnPendientes">Pendientes</button></div>
      <div class="seccion">
        <button id="btnRuta">Ruta <span id="flechaRuta">▾</span></button>
        <div id="listaDias"></div>
      </div>
      <div class="seccion"><button id="btnReservas">Reservas</button></div>
      <div class="seccion"><button id="btnMas">Más</button></div>
      <div class="seccion menu-pie">
        <button id="btnTema" type="button">🌓 Tema <span id="temaActual"></span></button>
        <button id="btnCerrarSesion" type="button">🚪 Cerrar sesión</button>
      </div>
    </nav>

    <main id="main"><p class="sub" style="padding:16px;">Cargando…</p></main>
    <div id="toastHost"></div>

    <!-- Fase 5b, punto 2: ficha de detalle, hoja inferior compartida por Ruta,
         Reservas, Ideas y Pendientes (un solo sitio que pintar/probar). -->
    <div id="fichaOverlay"></div>
    <div id="fichaSheet" class="ficha">
      <button id="btnCerrarFicha" aria-label="Cerrar ficha">✕</button>
      <div id="fichaContenido"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="./lib/timezone.js"></script>
  <script src="./lib/model.js"></script>
  <!-- storage.js ya se cargó en <head> (lo necesita el script de tema
       antes de pintar); cargarlo dos veces revienta con "Identifier
       'PREFIX' has already been declared" (bug real, encontrado en Chrome
       al verificar la Fase 7). -->
  <script src="./lib/hecho-overrides.js"></script>
  <script src="./lib/estado-overrides.js"></script>
  <script src="./lib/bases.js"></script>
  <script src="./lib/agenda.js"></script>
  <script src="./lib/sync.js"></script>
  <script>
    'use strict';
    var storage = makeStorage(window.localStorage);
    var main = document.getElementById('main');
    var toastHost = document.getElementById('toastHost');
    var toastTimer = null;

    var MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
    var DIAS_SEMANA = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
    function formatFechaCorta(fechaISO){ var p = fechaISO.split('-'); return parseInt(p[2], 10) + ' ' + MESES[parseInt(p[1], 10) - 1]; }
    function diaSemana(fechaISO){
      var p = fechaISO.split('-').map(Number);
      return DIAS_SEMANA[new Date(Date.UTC(p[0], p[1] - 1, p[2])).getUTCDay()];
    }
    function esc(s){
      return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    var ACCION_LABELS = { entrada: 'Entrada', expressPass: 'Express Pass (opcional)', checkin: 'Check-in', reserva: 'Reserva', equipaje: 'Equipaje', preguntarMaletas: 'Maletas' };
    function etiquetaAccion(accionId){ return ACCION_LABELS[accionId] || (accionId.charAt(0).toUpperCase() + accionId.slice(1)); }

    // ================================================================
    // Menú lateral
    // ================================================================
    var btnMenu = document.getElementById('btnMenu');
    var overlay = document.getElementById('overlay');
    var menu = document.getElementById('menu');
    function abrirMenu(){ overlay.classList.add('abierto'); menu.classList.add('abierto'); }
    function cerrarMenu(){ overlay.classList.remove('abierto'); menu.classList.remove('abierto'); }
    btnMenu.addEventListener('click', abrirMenu);
    overlay.addEventListener('click', cerrarMenu);

    // ================================================================
    // Fase 7: tema claro/oscuro (interruptor manual, además del valor de
    // sistema que ya fija el script de <head> antes de pintar).
    // ================================================================
    var btnTema = document.getElementById('btnTema');
    var temaActualEl = document.getElementById('temaActual');
    function temaActual(){ return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light'; }
    function actualizarBotonTema(){ temaActualEl.textContent = temaActual() === 'dark' ? '(oscuro)' : '(claro)'; }
    btnTema.addEventListener('click', function(){
      var nuevo = temaActual() === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', nuevo);
      storage.set('theme', nuevo);
      actualizarBotonTema();
    });
    actualizarBotonTema();

    // ================================================================
    // Fase 7: indicador discreto de estado -- offline y/o escrituras en cola
    // sin confirmar por Firebase todavía (colaEscrituras, definida más abajo
    // junto al resto de la lógica de sync).
    // ================================================================
    var estadoConexionEl = document.getElementById('estadoConexion');
    function actualizarEstadoConexion(){
      var offline = !navigator.onLine;
      var pendientes = colaEscrituras.length;
      if (!offline && !pendientes) { estadoConexionEl.hidden = true; return; }
      var partes = [];
      if (offline) partes.push('sin conexión');
      if (pendientes) partes.push('cambios pendientes: ' + pendientes);
      estadoConexionEl.textContent = partes.join(' · ');
      estadoConexionEl.hidden = false;
    }
    window.addEventListener('online', actualizarEstadoConexion);
    window.addEventListener('offline', actualizarEstadoConexion);

    // ================================================================
    // Fase 7: cerrar sesión -- borra la caché local de datos privados
    // (items/dias/guia con precio/localizador/teléfono, y las marcas
    // hecho/estadoManual de reservas) antes de salir. `migrado` y
    // `accessApproved` NO se tocan: no son datos de viaje, son banderas de
    // este dispositivo que siguen siendo válidas si vuelve a entrar la
    // misma cuenta.
    // ================================================================
    var btnCerrarSesion = document.getElementById('btnCerrarSesion');
    function limpiarCacheLocalPrivada(){
      storage.remove('dataCache');
      storage.remove('hechoOverridesCache');
      storage.remove('estadoOverridesCache');
      storage.remove('colaEscrituras');
      colaEscrituras = [];
      overridesEnMemoria = { hecho: {}, estado: {} };
      DATA = null; HOTELES = [];
    }
    btnCerrarSesion.addEventListener('click', function(){
      if (colaEscrituras.length && !confirm('Hay ' + colaEscrituras.length + ' cambio(s) sin sincronizar. ' +
        'Si cierras sesión ahora se perderán. ¿Cerrar sesión igualmente?')) return;
      limpiarCacheLocalPrivada();
      cerrarMenu();
      fbAuthM.signOut(fbAuth);
    });

    function construirMenuDias(dias, hoteles){
      var grupos = [], actual = null;
      dias.forEach(function(d){
        var hotel = hotelParaFecha(hoteles, d.fecha);
        var key = hotel ? hotel.id : 'sin-base:' + d.ciudad;
        if (!actual || actual.key !== key) {
          actual = { key: key, headerLabel: hotel ? ((hotel.ciudadBase ? hotel.ciudadBase + ' · ' : '') + hotel.nombre) : ('Sin base · ' + d.ciudad), dias: [] };
          grupos.push(actual);
        }
        actual.dias.push(d);
      });
      return grupos;
    }

    function renderMenuDias(){
      var grupos = construirMenuDias(DATA.dias, HOTELES);
      var listaDias = document.getElementById('listaDias');
      listaDias.innerHTML = grupos.map(function(g){
        return '<div class="base-header">' + esc(g.headerLabel) + '</div>' +
          g.dias.map(function(d){
            return '<button class="dia-chip" data-dia="' + d.fecha + '">' + esc(diaSemana(d.fecha)) + ' ' +
              esc(formatFechaCorta(d.fecha)) + ' <span class="ciudad">· ' + esc(d.ciudad) + '</span></button>';
          }).join('');
      }).join('');
      listaDias.querySelectorAll('.dia-chip').forEach(function(btn){
        btn.addEventListener('click', function(){ mostrarPantalla(btn.getAttribute('data-dia')); cerrarMenu(); });
      });
    }

    document.getElementById('btnRuta').addEventListener('click', function(){
      var l = document.getElementById('listaDias');
      l.style.display = l.style.display === 'none' ? 'block' : 'none';
    });
    document.getElementById('btnPendientes').addEventListener('click', function(){ mostrarPantalla('pendientes'); cerrarMenu(); });
    document.getElementById('btnReservas').addEventListener('click', function(){ mostrarPantalla('reservas'); cerrarMenu(); });
    document.getElementById('btnMas').addEventListener('click', function(){ mostrarPantalla('mas'); cerrarMenu(); });

    function actualizarMenuActivo(id){
      document.querySelectorAll('.dia-chip').forEach(function(el){ el.classList.toggle('activo', el.getAttribute('data-dia') === id); });
      document.getElementById('btnPendientes').classList.toggle('activo', id === 'pendientes');
      document.getElementById('btnReservas').classList.toggle('activo', id === 'reservas');
      document.getElementById('btnMas').classList.toggle('activo', id === 'mas');
    }

    // ================================================================
    // Router de pantallas. Bloque 2: el mapa se CREA al entrar en una
    // pantalla de día y se DESTRUYE (mapa.remove()) al salir — nunca queda
    // una instancia oculta con CSS de fondo.
    // ================================================================
    var mapa = null;
    function destruirMapaSiExiste(){ if (mapa) { mapa.remove(); mapa = null; } }

    // Pantalla activa (Fase 5): marcarHecho/marcarReservado necesitan volver
    // a pintar la pantalla desde la que se llamaron (Pendientes O Reservas,
    // ambas usan cardHTML/entryRegistry), no siempre Pendientes.
    var pantallaActualId = 'pendientes';

    function mostrarPantalla(id){
      destruirMapaSiExiste();
      pantallaActualId = id;
      actualizarMenuActivo(id);
      if (id === 'pendientes') { document.getElementById('tituloPantalla').textContent = 'Japón 2027 · Pendientes'; renderPendientesScreen(); }
      else if (id === 'reservas') { document.getElementById('tituloPantalla').textContent = 'Japón 2027 · Reservas'; renderReservasScreen(); }
      else if (id === 'mas') { document.getElementById('tituloPantalla').textContent = 'Japón 2027 · Más'; renderMasScreen(); }
      else { renderDiaScreen(id); }
    }

    function renderStub(titulo, texto){
      main.innerHTML = '<div class="placeholder"><p><strong>' + esc(titulo) + '</strong></p><p>' + esc(texto) + '</p></div>';
    }

    // Único punto que combina las dos capas de overrides (hecho + estado)
    // sobre los ítems importados -- usado por Pendientes, Ruta (un día) y
    // Reservas, para que un ítem marcado a mano se vea igual en las tres
    // pantallas. Fase 6: `overridesEnMemoria` es el reflejo en vivo de
    // Firebase (o de la caché local mientras conecta) -- ya NO se lee
    // localStorage aquí directamente (eso era Fase 5, antes de tener sync).
    function itemsConOverrides(){
      return applyEstadoOverrides(applyOverrides(DATA.items, overridesEnMemoria.hecho), overridesEnMemoria.estado);
    }

    // ================================================================
    // Pantalla: Pendientes (igual que antes, ahora vive dentro del router)
    // ================================================================
    function formatCountdown(minutos){
      if (minutos == null) return { big: '—', unit: '' };
      if (minutos <= 0) return { big: 'Ya abrió', unit: '' };
      var dias = Math.floor(minutos / 1440);
      if (dias >= 1) return { big: String(dias), unit: dias === 1 ? 'día' : 'días' };
      var horas = Math.floor((minutos % 1440) / 60);
      if (horas >= 1) return { big: String(horas), unit: horas === 1 ? 'hora' : 'horas' };
      return { big: String(minutos), unit: 'min' };
    }

    function showToast(texto, onDeshacer){
      if (toastTimer) clearTimeout(toastTimer);
      toastHost.innerHTML = '<div class="toast"><span>' + esc(texto) + '</span>' + (onDeshacer ? '<button id="toastDeshacer">Deshacer</button>' : '') + '</div>';
      if (onDeshacer) {
        document.getElementById('toastDeshacer').addEventListener('click', function(){
          toastHost.innerHTML = ''; if (toastTimer) clearTimeout(toastTimer); onDeshacer();
        });
      }
      toastTimer = setTimeout(function(){ toastHost.innerHTML = ''; }, 5000);
    }

    function pairsOf(entry){ return entry.tramos ? entry.tramos.map(function(t){ return [t.itemId, t.accionId]; }) : [[entry.itemId, entry.accionId]]; }

    // Fase 6: cada marca/deshecho actualiza la memoria en vivo, la caché
    // local (por si se cierra la app antes de que Firebase confirme) y
    // encola la escritura remota -- Deshacer manda un `remove` real
    // (valor null), nunca un `false` que un futuro merge pudiera revivir.
    function marcarHechoPar(itemId, accionId){
      overridesEnMemoria.hecho = markDone(overridesEnMemoria.hecho, itemId, accionId);
      storage.setJSON('hechoOverridesCache', overridesEnMemoria.hecho);
      escribirRemoto(rutaHecho(itemId, accionId), true);
    }
    function deshacerPar(itemId, accionId){
      overridesEnMemoria.hecho = undoDone(overridesEnMemoria.hecho, itemId, accionId);
      storage.setJSON('hechoOverridesCache', overridesEnMemoria.hecho);
      escribirRemoto(rutaHecho(itemId, accionId), null);
    }

    function marcarHecho(entry){
      pairsOf(entry).forEach(function(p){ marcarHechoPar(p[0], p[1]); });
      mostrarPantalla(pantallaActualId);
      showToast('Marcado como hecho', function(){ pairsOf(entry).forEach(function(p){ deshacerPar(p[0], p[1]); }); mostrarPantalla(pantallaActualId); });
    }
    function deshacerDesdeHechos(itemId, accionId){ deshacerPar(itemId, accionId); mostrarPantalla(pantallaActualId); }

    // "Marcar como reservado" (Fase 5, solo en Reservas): promueve el ÍTEM a
    // confirmado (estadoOverrides) Y de paso marca su acción como hecha
    // (hechoOverrides) -- reservar algo también resuelve su pendiente,
    // deben ir siempre juntos para que Pendientes no lo siga reclamando.
    function marcarReservado(itemId, accionId, nota){
      marcarHechoPar(itemId, accionId);
      var valor = { estado: 'confirmado', estadoManual: true, accionId: accionId, notaReserva: nota || null };
      overridesEnMemoria.estado = markConfirmado(overridesEnMemoria.estado, itemId, accionId, nota || null);
      storage.setJSON('estadoOverridesCache', overridesEnMemoria.estado);
      escribirRemoto(rutaEstado(itemId), valor);
      mostrarPantalla(pantallaActualId);
      showToast('Marcado como reservado', function(){ deshacerReservado(itemId, accionId); });
    }
    function deshacerReservado(itemId, accionId){
      deshacerPar(itemId, accionId);
      overridesEnMemoria.estado = undoConfirmado(overridesEnMemoria.estado, itemId);
      storage.setJSON('estadoOverridesCache', overridesEnMemoria.estado);
      escribirRemoto(rutaEstado(itemId), null);
      mostrarPantalla(pantallaActualId);
    }

    // `opts` (Fase 5, Reservas): {fechaRuta} añade un enlace al día de la
    // Ruta cuando el ítem tiene fecha; {mostrarReservar:true} sustituye el
    // botón normal "Marcar como hecho" por la caja de "Marcar como
    // reservado" (nota opcional + confirmar). Sin `opts`, comportamiento
    // idéntico al de siempre (Pendientes no pasa nada aquí).
    function cardHTML(entry, opts){
      opts = opts || {};
      var badge = '';
      if (entry.nivel === 2) badge = '<span class="badge warn">⚠️ hora sin confirmar</span>';
      if (entry.nivel === 3) badge = '<span class="badge watch">👀 vigilar apertura</span>';
      if (entry.nivel === 4) badge = '<span class="badge watch">📌 reservar ya</span>';

      var esGrupo = !!entry.tramos;
      var titulo = esGrupo ? etiquetaAccion(entry.accionId) : (etiquetaAccion(entry.accionId) + ' · ' + entry.nombre);
      var tramosHTML = esGrupo ? '<ul class="tramos">' + entry.tramos.map(function(t){ return '<li>' + esc(t.nombre) + '</li>'; }).join('') + '</ul>' : '';
      var reglaHTML = entry.accion.reglaApertura ? '<p class="regla">' + esc(entry.accion.reglaApertura) + '</p>' : '';
      var recomendacionHTML = entry.accion.recomendacion ? '<p class="regla">' + esc(entry.accion.recomendacion) + '</p>' : '';
      var url = entry.accion.dondeReservar || entry.accion.fuente;
      var linkHTML = url ? '<a class="btn" href="' + esc(url) + '" target="_blank" rel="noopener">Ir a reservar ↗</a>' : '';
      var rutaHTML = opts.fechaRuta ? '<button class="link" data-ir-dia="' + esc(opts.fechaRuta) + '">Ver en la Ruta → ' + esc(formatFechaCorta(opts.fechaRuta)) + '</button>' : '';

      var accionHTML = '', reservarHTML = '';
      if (opts.mostrarReservar) {
        reservarHTML = '<div class="reservar-box">' +
          '<input type="text" class="nota-input" placeholder="Nota (opcional): localizador, precio…" data-nota-item="' + esc(entry.itemId) + '">' +
          '<button class="primary" data-reservar-item="' + esc(entry.itemId) + '" data-reservar-accion="' + esc(entry.accionId) + '">Marcar como reservado</button>' +
          '</div>';
      } else {
        accionHTML = '<button class="primary" data-idx="' + entry._idx + '">Marcar como hecho</button>';
      }

      var rightHTML = '';
      if (entry.nivel === 1 || entry.nivel === 2) {
        var c = formatCountdown(entry.minutosHastaApertura);
        rightHTML = '<div class="countdown-big">' + esc(c.big) + '<span class="countdown-unit">' + esc(c.unit) + '</span></div>';
        if (entry.accion.horaConfirmada && entry.horas) {
          var md = entry.horas['Europe/Madrid'].split(' '), jst = entry.horas['Asia/Tokyo'].split(' ');
          rightHTML += '<div class="fecha-corta">' + formatFechaCorta(md[0]) + '</div>' +
            '<div class="fecha-corta hora-linea">' + md[1] + '</div>' +
            '<div class="hora-jst">' + formatFechaCorta(jst[0]) + '</div>' +
            '<div class="hora-jst hora-linea">' + jst[1] + ' JST</div>';
        } else {
          var mdW = entry.horas['Europe/Madrid'].split(' '), jstW = entry.horas['Asia/Tokyo'].split(' ');
          rightHTML += '<div class="fecha-corta warn">' + formatFechaCorta(mdW[0]) + '</div>' +
            '<div class="fecha-corta warn hora-linea">desde ' + mdW[1] + ' ⚠️</div>' +
            '<div class="hora-jst">' + formatFechaCorta(jstW[0]) + ' JST</div>';
        }
      }
      // Fase 5b, punto 2: el título abre la ficha completa -- solo para un
      // ítem suelto (un grupo de tramos, esGrupo, no tiene un único ítem al
      // que apuntar sin ambigüedad).
      var tituloHTML = esGrupo ? esc(titulo) : ('<span class="titulo-ficha" data-ficha="' + esc(entry.itemId) + '">' + esc(titulo) + '</span>');
      return '<div class="card"><div class="card-left"><h3>' + tituloHTML + '</h3>' + tramosHTML + badge + reglaHTML + recomendacionHTML +
        '<div class="actions">' + linkHTML + accionHTML + rutaHTML + '</div>' + reservarHTML +
        '</div><div class="card-right">' + rightHTML + '</div></div>';
    }

    // Delega los clics de "Ver en la Ruta" y "Marcar como reservado" -- se
    // reutiliza tal cual desde Pendientes, Reservas y cualquier pantalla
    // futura que pinte cardHTML con `opts`.
    function wireCardActions(container){
      container.querySelectorAll('button[data-ir-dia]').forEach(function(btn){
        btn.addEventListener('click', function(e){ e.stopPropagation(); mostrarPantalla(btn.getAttribute('data-ir-dia')); cerrarMenu(); });
      });
      container.querySelectorAll('button[data-reservar-item]').forEach(function(btn){
        btn.addEventListener('click', function(e){
          e.stopPropagation();
          var itemId = btn.getAttribute('data-reservar-item'), accionId = btn.getAttribute('data-reservar-accion');
          var card = btn.closest('.card');
          var input = card ? card.querySelector('.nota-input') : null;
          marcarReservado(itemId, accionId, input ? input.value.trim() : '');
        });
      });
      // Fase 5b, punto 2: cualquier elemento marcado con data-ficha (bloque
      // de un día, título de una tarjeta de Pendientes/Reservas, fila de
      // Ideas...) abre la misma ficha de detalle completa.
      container.querySelectorAll('[data-ficha]').forEach(function(el){
        el.addEventListener('click', function(e){
          e.stopPropagation();
          abrirFicha(el.getAttribute('data-ficha'));
        });
      });
    }

    // ================================================================
    // Ficha de detalle (Fase 5b, punto 2): TODOS los datos conservados de un
    // ítem, sin importar desde qué pantalla se abrió. Campos vacíos no se
    // muestran. Las procedencias fusionadas (fuentes[], v3/lib/twins.js)
    // aportan su propio bloque debajo con lo que tengan DISTINTO del
    // ganador -- si dos fuentes se contradicen (precio/horario distinto),
    // se ven las dos, con su procedencia, nunca se elige una a ciegas.
    // ================================================================
    var PROCEDENCIA_LABELS_FICHA = { ours: 'Nuestra', dani: 'Dani', maria: 'María', instagram: 'Instagram', ai: 'IA' };
    var ESTADO_BADGES_FICHA = { idea: '🧭 Idea', propuesta: '📝 Propuesta', confirmado: '✅ Confirmado' };
    var CAMPO_LABELS_FICHA = { notes: 'Descripción', tip: 'Tip', hours: 'Horario', price: 'Precio', yen: 'Precio (¥)', dur: 'Duración (min)', region: 'Región' };

    function campoHTML(label, valor){
      if (valor == null || valor === '') return '';
      return '<div class="campo"><b>' + esc(label) + '</b><p>' + esc(valor) + '</p></div>';
    }
    function mapsUrl(ubicacion){
      return ubicacion ? 'https://www.google.com/maps/search/?api=1&query=' + ubicacion.lat + ',' + ubicacion.lng : null;
    }
    // Campos de una fuente fusionada que NO coinciden con el ganador (o que
    // el ganador ni siquiera tiene) -- eso es justo lo que aporta de más.
    function camposDistintos(fuente, item){
      var campos = ['notes', 'tip', 'hours', 'price', 'yen', 'dur', 'region'];
      var out = [];
      campos.forEach(function(c){
        var v = fuente[c];
        if (v == null || v === '') return;
        if (item[c] !== v) out.push({ campo: c, valor: v });
      });
      return out;
    }

    function fichaHTML(item){
      var partes = [];
      partes.push('<h2>' + esc(item.nombre) + '</h2>');

      var badges = ['<span class="badge">' + (ESTADO_BADGES_FICHA[item.estado] || esc(item.estado)) + '</span>'];
      (item.procedencias || [item.procedencia]).forEach(function(p){
        badges.push('<span class="badge">' + esc(PROCEDENCIA_LABELS_FICHA[p] || p) + '</span>');
      });
      if (item.categoria) badges.push('<span class="badge">' + esc(CATEGORIA_LABELS[item.categoria] || item.categoria) + '</span>');
      if (item.ciudad) badges.push('<span class="badge">' + esc(item.ciudad) + '</span>');
      partes.push('<div class="badges">' + badges.join('') + '</div>');

      partes.push(campoHTML('Descripción', item.notes));
      partes.push(campoHTML('Nota de la Ruta', item.nota));
      partes.push(campoHTML('Horario', item.hours));
      partes.push(campoHTML('Precio', item.price || (item.yen != null ? '¥' + item.yen : null)));
      partes.push(campoHTML('Duración' + (item.duracionOrientativa ? ' (orientativa, del catálogo -- no de la Ruta)' : ''),
        item.dur != null ? item.dur + ' min' : null));
      partes.push(campoHTML('Tip', item.tip));
      if (item.region && item.region !== item.ciudad) partes.push(campoHTML('Región', item.region));

      // Alojamiento
      partes.push(campoHTML('Franja de check-in', item.franjaCheckIn ? (item.franjaCheckIn.desde + '–' + item.franjaCheckIn.hasta + (item.franjaCheckIn.confirmada ? '' : ' (por confirmar)')) : null));
      partes.push(campoHTML('Llegada estimada', item.llegadaEstimadaTexto));
      partes.push(campoHTML('Zona del hotel', item.hotelArea));
      partes.push(campoHTML('Dirección', item.address));
      partes.push(campoHTML('Teléfono', item.hotelPhone));
      partes.push(campoHTML('Referencia de reserva', item.bookingRef));
      partes.push(campoHTML('Nota de la reserva', item.notaReserva));

      // Vuelo
      partes.push(campoHTML('Vuelo', item.flight));
      partes.push(campoHTML('Aerolínea', item.airline));
      partes.push(campoHTML('Terminal', item.terminal));
      partes.push(campoHTML('Hora de llegada', item.arr));
      partes.push(campoHTML('Nota del vuelo', item.note));

      var enlaces = [];
      if (item.web) enlaces.push('<a class="btn" href="' + esc(item.web) + '" target="_blank" rel="noopener">🌐 Web</a>');
      if (item.video) enlaces.push('<a class="btn" href="' + esc(item.video) + '" target="_blank" rel="noopener">📷 Instagram</a>');
      var maps = mapsUrl(item.ubicacion);
      if (maps) enlaces.push('<a class="btn" href="' + esc(maps) + '" target="_blank" rel="noopener">📍 Google Maps</a>');
      if (enlaces.length) partes.push('<div class="enlaces">' + enlaces.join('') + '</div>');

      // Acciones pendientes (reservas) -- reutiliza detalleAccionHTML tal
      // cual (mismo dato, misma cuenta atrás que Pendientes/Reservas).
      (item.acciones || []).forEach(function(accion){
        if (!accion.necesaria) return;
        partes.push('<div class="detalle abierto">' + detalleAccionHTML(item.id, accion) + '</div>');
      });

      // Fuentes fusionadas: un bloque por cada procedencia distinta del
      // ganador, solo con lo que aporte DISTINTO (prioridad nº1 de
      // PROJECT.md es no perder el dato, no repetirlo tres veces igual).
      if (Array.isArray(item.fuentes) && item.fuentes.length > 1) {
        item.fuentes.forEach(function(f){
          if (f.id === item.id) return;
          var distintos = camposDistintos(f, item);
          var enlacesF = [];
          if (f.web && f.web !== item.web) enlacesF.push('<a class="btn" href="' + esc(f.web) + '" target="_blank" rel="noopener">🌐 Web</a>');
          if (f.video && f.video !== item.video) enlacesF.push('<a class="btn" href="' + esc(f.video) + '" target="_blank" rel="noopener">📷 Instagram</a>');
          if (!distintos.length && !enlacesF.length) return;
          var bloque = '<div class="fuente-bloque"><h4>' + esc(PROCEDENCIA_LABELS_FICHA[f.procedencia] || f.procedencia) +
            ' aporta (' + esc(f.nombre) + ')</h4>';
          distintos.forEach(function(d){ bloque += campoHTML(CAMPO_LABELS_FICHA[d.campo] || d.campo, d.valor); });
          if (enlacesF.length) bloque += '<div class="enlaces">' + enlacesF.join('') + '</div>';
          bloque += '</div>';
          partes.push(bloque);
        });
      }

      return partes.filter(Boolean).join('');
    }

    function abrirFicha(itemId){
      var item = itemsConOverrides().find(function(it){ return it.id === itemId; });
      if (!item) return;
      document.getElementById('fichaContenido').innerHTML = fichaHTML(item);
      document.getElementById('fichaOverlay').classList.add('abierto');
      document.getElementById('fichaSheet').classList.add('abierto');
      wireFichaActions(itemId);
    }
    function cerrarFicha(){
      document.getElementById('fichaOverlay').classList.remove('abierto');
      document.getElementById('fichaSheet').classList.remove('abierto');
    }
    document.getElementById('fichaOverlay').addEventListener('click', cerrarFicha);
    document.getElementById('btnCerrarFicha').addEventListener('click', cerrarFicha);
    document.addEventListener('keydown', function(e){ if (e.key === 'Escape') cerrarFicha(); });

    // El botón "Marcar como hecho" de detalleAccionHTML vive dentro de la
    // ficha (no de #main): se cablea aparte y, tras marcar, se refresca la
    // ficha Y la pantalla de debajo (Pendientes/Reservas cambian de sección
    // al momento).
    function wireFichaActions(itemId){
      var cont = document.getElementById('fichaContenido');
      cont.querySelectorAll('[data-marcar-item]').forEach(function(btn){
        btn.addEventListener('click', function(e){
          e.stopPropagation();
          var id = btn.getAttribute('data-marcar-item'), accionId = btn.getAttribute('data-marcar-accion');
          if (btn.getAttribute('data-marcar-hecho') === 'true') marcarHechoPar(id, accionId); else deshacerPar(id, accionId);
          mostrarPantalla(pantallaActualId);
          abrirFicha(itemId);
        });
      });
    }

    var entryRegistry = [];
    function registerEntries(list){ list.forEach(function(e){ e._idx = entryRegistry.length; entryRegistry.push(e); }); return list; }

    function renderPendientesView(view){
      entryRegistry = [];
      var html = '';
      var conFechaAgrupado = registerEntries(agruparPorApertura(view.conFecha));
      var vigilarReg = registerEntries(view.vigilar);
      var reservarYaReg = registerEntries(view.reservarYa);
      if (!conFechaAgrupado.length && !vigilarReg.length && !reservarYaReg.length) html += '<p class="empty">Nada pendiente. 🎉</p>';
      if (conFechaAgrupado.length) html += '<section><h2>Próximo a abrir</h2>' + conFechaAgrupado.map(cardHTML).join('') + '</section>';
      if (vigilarReg.length) html += '<section><h2>Vigilar apertura</h2>' + vigilarReg.map(cardHTML).join('') + '</section>';
      if (reservarYaReg.length) html += '<section><h2>Reservar ya, sin fecha</h2>' + reservarYaReg.map(cardHTML).join('') + '</section>';
      if (view.hechos.length) {
        html += '<details open><summary>✅ Ya hecho (' + view.hechos.length + ')</summary>' +
          view.hechos.map(function(h){
            return '<div class="hecho-row"><span>' + esc(h.nombre) + ' · ' + esc(etiquetaAccion(h.accionId)) + '</span>' +
              (h._overridden ? '<button class="link" data-undo-item="' + esc(h.itemId) + '" data-undo-accion="' + esc(h.accionId) + '">Deshacer</button>' : '') + '</div>';
          }).join('') + '</details>';
      }
      main.innerHTML = html;
      main.querySelectorAll('button[data-idx]').forEach(function(btn){ btn.addEventListener('click', function(){ marcarHecho(entryRegistry[Number(btn.getAttribute('data-idx'))]); }); });
      main.querySelectorAll('button[data-undo-item]').forEach(function(btn){
        btn.addEventListener('click', function(){ deshacerDesdeHechos(btn.getAttribute('data-undo-item'), btn.getAttribute('data-undo-accion')); });
      });
      wireCardActions(main);
    }

    function renderPendientesScreen(){
      if (!DATA) { renderSinDatos(); return; }
      var items = itemsConOverrides();
      var view = pendientesView(items, Date.now());
      view.hechos = view.hechos.map(function(h){ return Object.assign({}, h, { _overridden: isOverridden(overridesEnMemoria.hecho, h.itemId, h.accionId) }); });
      renderPendientesView(view);
    }

    // ================================================================
    // Pantalla: un día de la Ruta
    // ================================================================
    function modoIcono(item){
      if (item.tipo === 'vuelo') return '✈️';
      // Fase 5b: mismo criterio que grupoReserva del importador, reutilizado
      // en vez de duplicar la detección "bus" por nota.
      if (item.grupoReserva === 'buses' || (item.nota && /bus/i.test(item.nota))) return '🚌';
      return '🚆';
    }

    // Punto de SALIDA de un día (corrección 2026-09-16: el mapa trazaba la
    // ruta desde el hotel de ESTA noche, al que aún no se ha llegado). Es
    // el hotel de la noche anterior -- salvo el 9-abr, que es un hecho real
    // y documentado (llegada a Japón ese día, se sale del aeropuerto, no de
    // un hotel) y no algo que hotelDeAnoche() pueda derivar de los datos.
    var SALIDA_EXCEPCIONES = {
      '2027-04-09': { nombre: 'Aeropuerto de Narita', ubicacion: { lat: 35.772, lng: 140.3929 }, icono: '✈️' }
    };

    // Huecos locales sin tramo documentado en TRANSPORT (v2.1 raíz está
    // congelado, no se puede tocar): Nikkō → Kinugawa Onsen (12-abr) y el
    // salto local dentro de Fukuoka (20-abr). Decisión 2026-09-16: se cuentan
    // como "desplazamiento sin definir" igual que cualquier otro tramo sin
    // duración, en vez de quedar invisibles -- sin inventar hora ni modo de
    // transporte que no está documentado en ningún sitio.
    var GAPS_LOCALES_SIN_TRAMO = { '2027-04-12': 1, '2027-04-20': 1 };
    function salidaDelDia(fecha){
      if (SALIDA_EXCEPCIONES[fecha]) return SALIDA_EXCEPCIONES[fecha];
      var h = hotelDeAnoche(HOTELES, DATA.dias, fecha);
      return h ? { nombre: h.nombre, ubicacion: h.ubicacion, icono: '🏨' } : null;
    }

    function bloqueSalida(salida){
      return '<div class="bloque hito"><div class="franja">sin hora</div>' +
        '<div class="cuerpo"><h3>' + salida.icono + ' Salida desde ' + esc(salida.nombre) + '</h3></div></div>';
    }

    // Punto de LLEGADA (hotel de ESTA noche), SIEMPRE el último bloque del
    // día -- tanto si hoy es el día real de check-in (con su hora real si
    // la reserva la documenta, p.ej. Kyoto Guesthouse) como si es una noche
    // siguiente de una estancia de varias noches (sin evento de check-in
    // ese día: no se le pone una hora que no existe).
    // Hueco entre llegar a la ciudad y que abra el check-in (hoy, solo Kioto
    // 16-abr): se pinta ANTES del bloque de llegada, sin inventar si el hotel
    // guarda maletas o no -- esa pregunta vive en Pendientes (acción
    // 'preguntarMaletas', horneada en tools/v3-migrate-import.js).
    function bloqueHueco(hueco){
      return '<div class="bloque hueco"><div class="franja">' + esc(hueco.desde) + '</div>' +
        '<div class="cuerpo"><h3>🧳 Hueco ' + esc(hueco.desde) + '–' + esc(hueco.hasta) + ' · maletas</h3>' +
        '<p>El check-in aún no ha abierto. No consta si el hotel guarda el equipaje antes de esa hora (pendiente de preguntar).</p>' +
        '<span class="badge warn">⚠️ hueco sin resolver</span></div></div>';
    }

    // Franja real de la reserva + llegada ESTIMADA al hotel (regla
    // 2026-09-16: toda hora calculada por el asistente se pinta con "≈",
    // nunca como dato cierto) -- distinta de la franja, que sí es un dato de
    // la reserva. `avisoLlegada` ya viene calculado del importador (franja
    // sin confirmar, llegada antes de apertura, o margen al cierre < 1h).
    function bloqueLlegada(hotelHoy, fecha){
      var esHoyCheckin = fechaDe(hotelHoy) === fecha;
      var hora = esHoyCheckin ? horaDe(hotelHoy) : null;
      var franja = hotelHoy.franjaCheckIn;
      var detalleHTML = '';
      if (esHoyCheckin && franja) {
        detalleHTML += '<p>Franja de check-in: ' + esc(franja.desde) + '–' + esc(franja.hasta) +
          (franja.confirmada ? '' : ' <strong>⚠️ por confirmar</strong>') + '</p>';
        if (hotelHoy.llegadaEstimadaTexto) {
          detalleHTML += '<p>Llegada estimada al hotel: ' + esc(hotelHoy.llegadaEstimadaTexto) + '</p>';
        }
      }
      // Fase 5b: `notes` (campo real de la reserva), no `nota` -- ese campo ya
      // no existe en los ítems de hotel (ver tools/v3-migrate-import.js).
      var notaHTML = (esHoyCheckin && hotelHoy.notes) ? '<p>' + esc(hotelHoy.notes) + '</p>' : '';
      var avisoHTML = (esHoyCheckin && hotelHoy.avisoLlegada) ? ' <span class="badge warn">⚠️ revisar llegada/franja</span>' : '';
      var huecoHTML = (esHoyCheckin && hotelHoy.huecoAntesCheckin) ? bloqueHueco(hotelHoy.huecoAntesCheckin) : '';
      return huecoHTML + '<div class="bloque hito"><div class="franja">' + (esHoyCheckin ? (hora ? '≈ ' + hora : 'sin hora') : '') + '</div>' +
        '<div class="cuerpo"><h3>🏨 <span class="titulo-ficha" data-ficha="' + esc(hotelHoy.id) + '">' + esc(hotelHoy.nombre) + '</span></h3>' + detalleHTML + notaHTML +
        '<span class="badge">✅ confirmado</span>' + avisoHTML + '</div></div>';
    }

    // "Mismo dato que Pendientes, sin recalcular": reutiliza las MISMAS
    // funciones de v3/lib/model.js (precisionLevel/accionAbreEnUtc/
    // formatInZones) que ya usa Pendientes, no una fórmula aparte.
    function detalleAccionHTML(itemId, accion){
      var partes = [];
      if (accion.reglaApertura) partes.push('<p class="regla">' + esc(accion.reglaApertura) + '</p>');
      // Fase 5b: mismo arreglo que cardHTML -- `recomendacion` es un campo
      // distinto de `reglaApertura` (p.ej. la pregunta de maletas de Kioto,
      // nivel 4 a propósito) y también hay que pintarlo aquí.
      if (accion.recomendacion) partes.push('<p class="regla">' + esc(accion.recomendacion) + '</p>');
      var nivel = precisionLevel(accion);
      if (nivel === 1 || nivel === 2) {
        var utc = accionAbreEnUtc(accion);
        var h = formatInZones(utc, ['Europe/Madrid', 'Asia/Tokyo']);
        var md = h['Europe/Madrid'].split(' '), jst = h['Asia/Tokyo'].split(' ');
        if (nivel === 1 && accion.horaConfirmada) {
          partes.push('<p><strong>Abre: ' + formatFechaCorta(md[0]) + ' · ' + md[1] + ' Madrid</strong> (' + formatFechaCorta(jst[0]) + ' · ' + jst[1] + ' JST)</p>');
        } else {
          partes.push('<p><strong>Abre: ' + formatFechaCorta(md[0]) + ' · desde ' + md[1] + ' Madrid ⚠️</strong></p>');
        }
      } else if (nivel === 3) {
        partes.push('<p><strong>👀 Vigilar apertura</strong></p>');
      } else {
        partes.push('<p><strong>📌 Reservar ya, sin fecha</strong></p>');
      }
      var url = accion.dondeReservar || accion.fuente;
      if (url) partes.push('<a class="btn" href="' + esc(url) + '" target="_blank" rel="noopener">Ir a reservar ↗</a>');
      partes.push('<div class="actions"><button class="' + (accion.hecho ? '' : 'primary') + '" data-marcar-item="' + esc(itemId) + '" data-marcar-accion="' + esc(accion.id) + '" data-marcar-hecho="' + (!accion.hecho) + '">' +
        (accion.hecho ? 'Deshacer' : 'Marcar como hecho') + '</button></div>');
      return partes.join('');
    }

    function bloqueItem(item, index, numParada){
      var esTransporte = item.tipo === 'trayecto' || item.tipo === 'vuelo';
      var hora = horaDe(item);
      var dur = duracionMinutos(item);
      // Fase 5b, punto 4: una duración calculada con el `dur` del catálogo
      // (no de RUTA_DAYS) se marca "orientativa", nunca como dato cierto.
      var durHTML = dur != null
        ? (item.duracionOrientativa ? '~' + dur + ' min (orientativa)' : dur + ' min')
        : 'sin duración';
      var icono = iconoEstado(item);
      var tituloExtra = esTransporte ? (modoIcono(item) + ' ' + item.nombre) : ('<span class="num">' + numParada + '</span>' + item.nombre);
      // Fase 5b, punto 2: tocar CUALQUIER parada abre su ficha completa (ya
      // no un acordeón que solo enseñaba la acción de reserva -- la ficha
      // incluye eso y todo lo demás).
      return '<div class="bloque' + (esTransporte ? ' transporte' : '') + ' clicable" data-ficha="' + esc(item.id) + '">' +
        '<div class="franja">' + (hora || (esTransporte ? '' : 'sin hora')) + '<span class="dur">' + durHTML + '</span></div>' +
        '<div class="cuerpo"><h3>' + tituloExtra + '</h3>' +
        (item.nota ? '<p>' + esc(item.nota) + '</p>' : '') +
        '<span class="badge' + (icono === '🎫' ? ' tag' : '') + '">' + icono + ' ' + (icono === '🎫' ? 'requiere reserva' : (item.estado === 'confirmado' ? 'confirmado' : 'propuesta')) + '</span>' +
        '</div></div>';
    }

    function renderDiaScreen(fecha){
      if (!DATA) { renderSinDatos(); return; }
      var items = itemsConOverrides();
      var diaInfo = DATA.dias.find(function(d){ return d.fecha === fecha; });
      var hotel = hotelParaFecha(HOTELES, fecha);
      var itemsDia = itemsDeFecha(items, fecha);
      var salida = salidaDelDia(fecha);

      document.getElementById('tituloPantalla').textContent = 'Japón 2027 · ' + formatFechaCorta(fecha);

      var baseHTML = hotel
        ? '🏨 ' + esc(hotel.nombre) + ' <span class="badge">✅ confirmado</span>'
        : '<span class="badge warn">⚠️ sin base confirmada esta noche</span>';

      // El check-in de hoy, si existe como ítem real de este día, se pinta
      // con el estilo de llegada (bloqueLlegada) EN SU SITIO: si tiene hora
      // real (de la reserva o estándar del hotel) se intercala cronológicamente
      // como cualquier otra parada -- ordenarDia ya lo garantiza (corrección
      // 2026-09-16); si no tiene hora, ordenarDia lo manda al final del
      // "resto" del día, nunca al principio.
      var numParada = 0;
      var bloquesHTML = itemsDia.map(function(it, i){
        if (it.tipo === 'alojamiento') return bloqueLlegada(it, fecha);
        if (it.tipo === 'lugar') numParada++;
        return bloqueItem(it, i, numParada);
      }).join('');

      // Estancias de varias noches (p.ej. 17-18 abr en Kioto): el check-in
      // real solo existe como ítem el día de la llegada, así que en las
      // noches siguientes no hay nada en itemsDia que lo represente -- se
      // añade aquí, al final, solo para rellenar ese hueco real.
      var hayAlojamientoHoy = itemsDia.some(function(it){ return it.tipo === 'alojamiento'; });
      var salidaHTML = salida ? bloqueSalida(salida) : '';
      var llegadaHTML = (hotel && !hayAlojamientoHoy) ? bloqueLlegada(hotel, fecha) : '';

      // El recuento honesto ("sin hora/sin duración") sigue mirando TODOS
      // los ítems reales del día, check-in incluido -- solo cambia DÓNDE se
      // pinta el check-in, no si cuenta para la tabla ya reportada.
      var conteo = contarSinDatos(itemsDia);
      var desplazamientosSinDefinir = conteo.desplazamientosSinDefinir + (GAPS_LOCALES_SIN_TRAMO[fecha] || 0);
      var notaHTML = '';
      if (conteo.sinHora || conteo.sinDuracion || desplazamientosSinDefinir) {
        notaHTML = '<div class="nota-final">Este día: ' + conteo.sinHora + ' actividad(es) sin hora, ' +
          conteo.sinDuracion + ' sin duración, ' + conteo.duracionOrientativa + ' con duración orientativa, ' +
          desplazamientosSinDefinir + ' desplazamiento(s) sin definir.</div>';
      }

      main.innerHTML =
        '<div class="dia-header"><p class="fecha">' + esc(diaSemana(fecha)) + ' ' + esc(formatFechaCorta(fecha)) + ' · ' + esc(diaInfo ? diaInfo.ciudad : '') + '</p>' +
        '<p class="base">' + baseHTML + '</p></div>' +
        '<div id="mapaDia"></div>' +
        '<div class="agenda">' + salidaHTML + (bloquesHTML || (salidaHTML || llegadaHTML ? '' : '<p class="empty">Sin paradas este día.</p>')) + llegadaHTML + '</div>' +
        notaHTML;

      wireCardActions(main);

      // Mapa (corrección 2026-09-16): pin 0 = salida (hotel de anoche, o el
      // aeropuerto el 9-abr), pines numerados = paradas reales en el MISMO
      // orden y número que la agenda, último pin = hotel de esta noche --
      // geográficamente el día siempre "acaba" ahí, sea cual sea la hora del
      // check-in (que en la agenda sí puede ir intercalada). La línea sigue
      // exactamente ese orden -- ya no empieza en un hotel al que todavía no
      // se ha llegado.
      var conNumero = [];
      var n = 0;
      itemsDia.forEach(function(it){
        if (it.tipo !== 'lugar') return;
        n++;
        if (it.ubicacion) conNumero.push({ num: n, item: it });
      });
      mapa = L.map('mapaDia', { zoomControl: false });
      var capaTeselas = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 19, attribution: '&copy; Esri'
      }).addTo(mapa);
      // Fase 7: las teselas ya vistas quedan cacheadas por el service worker
      // (jp27v3-teselas, límite razonable) y se sirven igual sin red. Si
      // falta alguna (zona nunca visitada con red) y no hay conexión, aviso
      // claro en vez de dejar la cuadrícula gris sin explicación.
      if (!navigator.onLine) {
        var avisoMapaMostrado = false;
        capaTeselas.on('tileerror', function(){
          if (avisoMapaMostrado) return;
          avisoMapaMostrado = true;
          var mapaEl = document.getElementById('mapaDia');
          var aviso = document.createElement('div');
          aviso.className = 'mapa-offline-aviso';
          aviso.textContent = '📵 Mapa no disponible sin conexión (solo se ven las zonas ya visitadas con red).';
          mapaEl.parentNode.insertBefore(aviso, mapaEl);
        });
      }
      var pinHito = function(html, color){
        return L.divIcon({ className: '', html: '<div style="width:22px;height:22px;border-radius:50%;background:' + color + ';color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;border:2px solid white;">' + html + '</div>', iconSize: [22, 22], iconAnchor: [11, 11] });
      };
      var puntos = [];
      if (salida && salida.ubicacion) {
        puntos.push([salida.ubicacion.lat, salida.ubicacion.lng]);
        L.marker([salida.ubicacion.lat, salida.ubicacion.lng], { icon: pinHito('🚪', '#6b675f') }).addTo(mapa).bindPopup('Salida: ' + esc(salida.nombre));
      }
      conNumero.forEach(function(p){
        puntos.push([p.item.ubicacion.lat, p.item.ubicacion.lng]);
        L.marker([p.item.ubicacion.lat, p.item.ubicacion.lng], {
          icon: L.divIcon({ className: '', html: '<div style="width:20px;height:20px;border-radius:50%;background:#b23a2e;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid white;">' + p.num + '</div>', iconSize: [20, 20], iconAnchor: [10, 10] })
        }).addTo(mapa).bindPopup(esc(p.item.nombre));
      });
      if (hotel && hotel.ubicacion) {
        puntos.push([hotel.ubicacion.lat, hotel.ubicacion.lng]);
        L.marker([hotel.ubicacion.lat, hotel.ubicacion.lng], { icon: pinHito('🏨', '#3a7d44') }).addTo(mapa).bindPopup('Esta noche: ' + esc(hotel.nombre));
      }
      if (puntos.length > 1) L.polyline(puntos, { color: '#b23a2e', weight: 2, dashArray: '4,4' }).addTo(mapa);
      mapa.invalidateSize();
      if (puntos.length) mapa.fitBounds(L.latLngBounds(puntos).pad(0.25), { maxZoom: 16 });
      else mapa.setView([35.68, 139.76], 9);
    }

    // ================================================================
    // Pantalla: Reservas (Fase 5) -- todo lo que se compra, en 3 grupos:
    // ✅ Confirmado (hoteles/vuelos reales, o lo que el usuario marque a
    // mano desde aquí), 🎫 Por reservar (con acción pendiente, reutiliza
    // pendientesView tal cual) y 👀 Vigilar apertura (sin fecha). Cada
    // elemento enlaza a su día en la Ruta cuando el ítem tiene fecha --
    // nunca se inventa una si no la trae (p.ej. una idea suelta no la
    // tiene, así que nunca llega aquí de todos modos: solo confirmado o con
    // acciones pendientes participa).
    // ================================================================
    function confirmadoCardHTML(item, fechaRuta){
      var rutaHTML = fechaRuta ? '<button class="link" data-ir-dia="' + esc(fechaRuta) + '">Ver en la Ruta → ' + esc(formatFechaCorta(fechaRuta)) + '</button>' : '';
      var icono = item.tipo === 'vuelo' ? '✈️' : (item.tipo === 'alojamiento' ? '🏨' : (item.tipo === 'trayecto' ? '🚆' : '📍'));
      var notaHTML = item.notaReserva ? '<p class="regla">' + esc(item.notaReserva) + '</p>' : '';
      var manualHTML = item.estadoManual
        ? '<span class="badge">🖊️ marcado a mano</span> <button class="link" data-deshacer-reservado="' + esc(item.id) + '" data-deshacer-accion="' + esc(item.accionReservadaId || '') + '">Deshacer</button>'
        : '';
      return '<div class="card"><div class="card-left"><h3>' + icono + ' <span class="titulo-ficha" data-ficha="' + esc(item.id) + '">' + esc(item.nombre) + '</span></h3>' + notaHTML +
        '<span class="badge">✅ confirmado</span> ' + manualHTML +
        '<div class="actions">' + rutaHTML + '</div></div></div>';
    }

    // Fase 5b, punto 3: filtro de Reservas por tipo de reserva. Clasificado
    // en el importador (grupoReserva, tools/v3-migrate-import.js) -- aquí
    // solo se pinta y se filtra, nunca se reclasifica a mano.
    var reservasFiltro = 'todo';
    var GRUPO_RESERVA_LABELS = {
      vuelos: '✈️ Vuelos', hoteles: '🏨 Hoteles', trenes: '🚆 Trenes', buses: '🚌 Buses',
      experiencias: '🎟️ Experiencias', comidas: '🍜 Comidas'
    };
    var GRUPO_RESERVA_ORDEN = ['vuelos', 'hoteles', 'trenes', 'buses', 'experiencias', 'comidas'];

    function authGateHTML(view, user, errorMsg){
      if (view === 'connecting') return '<p class="auth-status-msg">Conectando…</p>';

    // Comprueba el estado aprobado/pending/rejected del MISMO nodo de acceso
    // que usa v2.1 -- v3 nunca escribe ahí, solo lee.
    async function resolverAcceso(user){
      currentUser = user;
      if (!user) { renderAuthGate('signin', null); return; }
      renderAuthGate('connecting', user);
      if (navigator.onLine) {
        try {
          var snap = await fbDbM.get(fbDbM.ref(fbDb, V2_ACCESS_PATH + '/users/' + user.uid + '/status'));
          if (snap.val() === 'approved') { storage.set('accessApproved', '1'); await arrancarAppV3(); }
          else { renderAuthGate('sin-acceso', user); }
          return;
        } catch (e) { /* sin red pese a navigator.onLine: sigue abajo */ }
      }
      // Fase 7 (arranque en frío sin red): Auth recuerda la sesión offline
      // (browserLocalPersistence), pero comprobar el nodo access/ necesita
      // red. Solo se entra igualmente si ESTE dispositivo ya confirmó el
      // acceso aprobado alguna vez con éxito -- si nunca lo confirmó, no hay
      // forma segura de saltarse la comprobación.
      if (storage.get('accessApproved') === '1') { await arrancarAppV3(); return; }
      renderAuthGate('error', user);
    }

    async function initAuthV3(){
      // Defensivo (mismo patrón que initAuth() en v2.1): sin red, esto no
      // debe tumbar el resto del arranque, solo dejar el aviso de "no se
      // pudo conectar".
      try {
        var appM = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
        var authM = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');
        var dbM = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js');
        fbApp = appM.initializeApp(FIREBASE_CONFIG);
        fbAuth = authM.getAuth(fbApp);
        fbDb = dbM.getDatabase(fbApp);
        fbAuthM = authM;
        fbDbM = { ref: dbM.ref, get: dbM.get, set: dbM.set, remove: dbM.remove, onValue: dbM.onValue };
        try { await authM.setPersistence(fbAuth, authM.browserLocalPersistence); } catch (e) {}
        authM.onAuthStateChanged(fbAuth, resolverAcceso);
      } catch (e) {
        renderAuthGate('error', null);
      }
    }

    // Cola de escrituras offline (corrección 3, 2026-09-17): cada mutación
    // se encola y se persiste en localStorage ANTES de intentar la red, así
    // que cerrar la app en modo avión nunca la pierde -- se reintenta sola
    // en el próximo evento de reconexión (.info/connected, más abajo).
    function intentarVaciarCola(){
      if (!fbDb) return;
      colaEscrituras.slice().forEach(function(entrada){
        var ref = fbDbM.ref(fbDb, V3_PATH + '/state/' + entrada.ruta);
        var op = entrada.valor === null ? fbDbM.remove(ref) : fbDbM.set(ref, entrada.valor);
        op.then(function(){
          colaEscrituras = quitarDeCola(colaEscrituras, entrada.ruta);
          storage.setJSON('colaEscrituras', colaEscrituras);
          actualizarEstadoConexion();
        }).catch(function(){ /* sigue en la cola; se reintenta al reconectar */ });
      });
    }
    function escribirRemoto(ruta, valor){
      colaEscrituras = encolarEscritura(colaEscrituras, ruta, valor);
      storage.setJSON('colaEscrituras', colaEscrituras);
      actualizarEstadoConexion();
      intentarVaciarCola();
    }

    async function arrancarAppV3(){
      try {
        // Fase 7: completo offline -- arranque en frío sin red usa la caché
        // local (dataCache/hechoOverridesCache/estadoOverridesCache) tal
        // cual quedó en la última visita con red de ESTE dispositivo. Si un
        // fetch falla pese a navigator.onLine (red intermitente), se cae al
        // mismo camino de caché en vez de dejar la app en blanco.
        var offline = !navigator.onLine;
        if (!offline) {
          try {
            var itemsSnap = await fbDbM.get(fbDbM.ref(fbDb, V3_PATH + '/state/items'));
            var items = itemsSnap.val();
            if (items) {
              var diasSnap = await fbDbM.get(fbDbM.ref(fbDb, V3_PATH + '/state/dias'));
              var guiaSnap = await fbDbM.get(fbDbM.ref(fbDb, V3_PATH + '/state/guia'));
              DATA = { items: items, dias: diasSnap.val() || [], guia: guiaSnap.val() || null };
              storage.setJSON('dataCache', DATA);
            } else {
              DATA = null;
            }
          } catch (e) { offline = true; }
        }
        if (offline || !DATA) {
          var cache = storage.getJSON('dataCache', null);
          if (cache && cache.items) DATA = cache;
        }
        if (!DATA) { renderSinDatos(); return; }
        HOTELES = DATA.items.filter(function(it){ return it.tipo === 'alojamiento' && it.estado === 'confirmado'; });

        var hechoRemoto = null, estadoRemoto = null;
        if (!offline) {
          try {
            var hechoRemotoSnap = await fbDbM.get(fbDbM.ref(fbDb, V3_PATH + '/state/hechoOverrides'));
            var estadoRemotoSnap = await fbDbM.get(fbDbM.ref(fbDb, V3_PATH + '/state/estadoOverrides'));
            hechoRemoto = hechoRemotoSnap.val() || {};
            estadoRemoto = estadoRemotoSnap.val() || {};
          } catch (e) { offline = true; }
        }

        // Corrección 1, 2026-09-17: fusión "hecho gana" SOLO la primera vez
        // que ESTE móvil se conecta tras la Fase 6 (flag jp27v3:migrado), y
        // solo con red (necesita lo remoto de verdad para fusionar). Después,
        // Firebase manda solo -- Deshacer borra la clave remota de verdad,
        // nunca resucita desde una caché local vieja.
        var seAcabaDeMigrar = false;
        if (!offline) {
          seAcabaDeMigrar = storage.get('migrado') !== '1';
          if (seAcabaDeMigrar) {
            var hechoLocalViejo = storage.getJSON('hechoOverrides', {});
            var estadoLocalViejo = storage.getJSON('estadoOverrides', {});
            var hechoFundido = fusionInicialHecho(hechoLocalViejo, hechoRemoto);
            var estadoFundido = fusionInicialEstado(estadoLocalViejo, estadoRemoto);
            Object.keys(hechoFundido).forEach(function(clave){ if (hechoFundido[clave] === true) escribirRemoto('hechoOverrides/' + clave, true); });
            Object.keys(estadoFundido).forEach(function(clave){ escribirRemoto('estadoOverrides/' + clave, estadoFundido[clave]); });
            storage.set('migrado', '1');
            overridesEnMemoria.hecho = hechoFundido;
            overridesEnMemoria.estado = estadoFundido;
          } else {
            overridesEnMemoria.hecho = hechoRemoto;
            overridesEnMemoria.estado = estadoRemoto;
          }
          storage.setJSON('hechoOverridesCache', overridesEnMemoria.hecho);
          storage.setJSON('estadoOverridesCache', overridesEnMemoria.estado);
        } else {
          // Sin red: usa lo último sincronizado en este dispositivo. La
          // migración de corrección 1 se queda pendiente (storage.get('migrado')
          // sigue sin valer '1') hasta la próxima vez que haya conexión.
          overridesEnMemoria.hecho = storage.getJSON('hechoOverridesCache', {});
          overridesEnMemoria.estado = storage.getJSON('estadoOverridesCache', {});
        }

        // Escuchas en vivo -- se registran SIEMPRE, incluso arrancando sin
        // red: no fallan (esperan a que haya conexión) y así, si vuelve la
        // red a media sesión, la app se pone al día sola sin recargar.
        // Ojo (bug real, encontrado al probarlo con un mock): justo tras
        // migrar, las escrituras de la fusión pueden seguir en vuelo -- si
        // el primer snapshot de este listener llega ANTES de que el
        // servidor las confirme, pisaría con datos viejos la fusión que se
        // acaba de calcular en memoria. Se ignora solo ESE primer snapshot
        // cuando venimos de migrar; a partir del segundo, en vivo normal.
        var ignorarPrimerSnapshotHecho = seAcabaDeMigrar, ignorarPrimerSnapshotEstado = seAcabaDeMigrar;
        fbDbM.onValue(fbDbM.ref(fbDb, V3_PATH + '/state/hechoOverrides'), function(snap){
          if (ignorarPrimerSnapshotHecho) { ignorarPrimerSnapshotHecho = false; return; }
          overridesEnMemoria.hecho = snap.val() || {};
          storage.setJSON('hechoOverridesCache', overridesEnMemoria.hecho);
          if (pantallaActualId) mostrarPantalla(pantallaActualId);
        });
        fbDbM.onValue(fbDbM.ref(fbDb, V3_PATH + '/state/estadoOverrides'), function(snap){
          if (ignorarPrimerSnapshotEstado) { ignorarPrimerSnapshotEstado = false; return; }
          overridesEnMemoria.estado = snap.val() || {};
          storage.setJSON('estadoOverridesCache', overridesEnMemoria.estado);
          if (pantallaActualId) mostrarPantalla(pantallaActualId);
        });
        // Reconexión real (RTDB, estándar): vacía la cola offline sola y
        // refresca el indicador de estado.
        fbDbM.onValue(fbDbM.ref(fbDb, '.info/connected'), function(snap){
          actualizarEstadoConexion();
          if (snap.val()) intentarVaciarCola();
        });

        document.getElementById('authGate').style.display = 'none';
        document.getElementById('appRoot').style.display = '';
        renderMenuDias();
        mostrarPantalla('pendientes');
        actualizarEstadoConexion();
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js', { scope: './' });
      } catch (e) {
        renderAuthGate('error', currentUser);
      }
    }

    initAuthV3();
  </script>
</body>
</html>
