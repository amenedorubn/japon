<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Japón 2027 · v3 (en construcción)</title>
<style>
  :root{
    --bg:#f7f5f0; --card:#ffffff; --ink:#1c1a17; --muted:#6b675f;
    --line:#e3ded3; --accent:#b23a2e; --warn:#a9670d; --ok:#3a7d44;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#15130f; --card:#211e19; --ink:#efece5; --muted:#a49d8d;
      --line:#3a352c; --accent:#e2685a; --warn:#e0a03c; --ok:#6fbf7a;
    }
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    padding:0 12px 40px; max-width:520px; margin-inline:auto;
  }
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 4px; position:sticky; top:0; background:var(--bg); z-index:2;
  }
  header nav a{color:var(--muted); font-size:.8rem; text-decoration:none; margin-left:10px;}
  header nav a.activo{color:var(--accent); font-weight:600;}
  h1{font-size:1.05rem; margin:0;}
  .sub{color:var(--muted); font-size:.78rem; margin:2px 0 0;}
  section{margin-top:18px;}
  section > h2{font-size:.82rem; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:0 0 8px 4px;}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    margin-bottom:8px; display:flex; align-items:stretch; overflow:hidden;
  }
  .card-left{flex:3 1 0; min-width:0; padding:10px 12px;}
  .card-right{
    flex:1 1 0; min-width:72px; flex-shrink:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:8px 6px; border-left:1px solid var(--line);
  }
  .card h3{margin:0 0 4px; font-size:.95rem; overflow-wrap:anywhere;}
  .tramos{margin:2px 0 6px; padding:0; list-style:none; font-size:.82rem; color:var(--muted);}
  .tramos li{overflow-wrap:anywhere;}
  .badge{
    display:inline-flex; align-items:center; gap:4px; font-size:.72rem;
    padding:2px 7px; border-radius:999px; border:1px solid var(--line); margin-bottom:6px;
  }
  .badge.warn{color:var(--warn); border-color:var(--warn);}
  .badge.watch{color:var(--muted); border-color:var(--line);}
  .regla{font-size:.78rem; color:var(--muted); margin:2px 0 8px;}
  .actions{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;}
  .countdown-big{font-size:1.7rem; font-weight:700; line-height:1.05; white-space:nowrap;}
  .countdown-unit{font-size:.7rem; color:var(--muted); display:block;}
  .fecha-corta{font-size:.76rem; color:var(--muted); margin-top:6px; white-space:nowrap;}
  .fecha-corta.warn{color:var(--warn);}
  .hora-jst{font-size:.66rem; color:var(--muted); opacity:.8; white-space:nowrap; margin-top:2px;}
  button, a.btn{
    font:inherit; font-size:.78rem; padding:5px 10px; border-radius:8px;
    border:1px solid var(--line); background:transparent; color:var(--ink);
    cursor:pointer; text-decoration:none; display:inline-block;
  }
  button.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  button.link{border:none; padding:2px 0; text-decoration:underline; color:var(--accent);}
  details{margin-top:18px;}
  summary{cursor:pointer; color:var(--muted); font-size:.85rem;}
  .hecho-row{display:flex; justify-content:space-between; align-items:center; padding:6px 4px; font-size:.85rem;}
  .empty, .devnote{text-align:center; color:var(--muted); padding:40px 12px; font-size:.9rem;}
  .devnote code{background:var(--card); padding:1px 5px; border-radius:4px;}
  .toast{
    position:fixed; left:12px; right:12px; bottom:16px; max-width:496px; margin-inline:auto;
    background:var(--ink); color:var(--bg); border-radius:10px; padding:10px 14px;
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    font-size:.85rem; z-index:3;
  }
  .toast button{border-color:var(--bg); color:var(--bg);}
</style>
</head>
<body>
  <header>
    <div>
      <h1>Japón 2027 · Pendientes</h1>
      <p class="sub">v3 · en construcción</p>
    </div>
    <nav><a href="./index.html" class="activo">Pendientes</a><a href="./ruta.html">Ruta</a></nav>
  </header>
  <main id="app">
    <p class="sub">Cargando…</p>
  </main>
  <div id="toastHost"></div>

  <script src="./lib/timezone.js"></script>
  <script src="./lib/model.js"></script>
  <script src="./lib/storage.js"></script>
  <script src="./lib/hecho-overrides.js"></script>
  <script>
    'use strict';
    var storage = makeStorage(window.localStorage);
    var app = document.getElementById('app');
    var toastHost = document.getElementById('toastHost');
    var toastTimer = null;

    var MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
    function formatFechaCorta(fechaISO){
      var p = fechaISO.split('-');
      return parseInt(p[2], 10) + ' ' + MESES[parseInt(p[1], 10) - 1];
    }

    var ACCION_LABELS = { entrada: 'Entrada', expressPass: 'Express Pass (opcional)', checkin: 'Check-in', reserva: 'Reserva', equipaje: 'Equipaje' };
    function etiquetaAccion(accionId){
      return ACCION_LABELS[accionId] || (accionId.charAt(0).toUpperCase() + accionId.slice(1));
    }

    function formatCountdown(minutos){
      if (minutos == null) return { big: '—', unit: '' };
      if (minutos <= 0) return { big: 'Ya abrió', unit: '' };
      var dias = Math.floor(minutos / 1440);
      if (dias >= 1) return { big: String(dias), unit: dias === 1 ? 'día' : 'días' };
      var horas = Math.floor((minutos % 1440) / 60);
      if (horas >= 1) return { big: String(horas), unit: horas === 1 ? 'hora' : 'horas' };
      return { big: String(minutos), unit: 'min' };
    }

    function esc(s){
      return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function showToast(texto, onDeshacer){
      if (toastTimer) clearTimeout(toastTimer);
      toastHost.innerHTML = '<div class="toast"><span>' + esc(texto) + '</span>' +
        (onDeshacer ? '<button id="toastDeshacer">Deshacer</button>' : '') + '</div>';
      if (onDeshacer) {
        document.getElementById('toastDeshacer').addEventListener('click', function(){
          toastHost.innerHTML = '';
          if (toastTimer) clearTimeout(toastTimer);
          onDeshacer();
        });
      }
      toastTimer = setTimeout(function(){ toastHost.innerHTML = ''; }, 5000);
    }

    // Un "grupo" (par de tramos con el mismo billete) marca/deshace TODAS
    // sus acciones a la vez: es una sola gestión real (through check-in).
    function pairsOf(entry){
      return entry.tramos ? entry.tramos.map(function(t){ return [t.itemId, t.accionId]; }) : [[entry.itemId, entry.accionId]];
    }

    function marcarHecho(entry){
      var overrides = storage.getJSON('hechoOverrides', {});
      pairsOf(entry).forEach(function(p){ overrides = markDone(overrides, p[0], p[1]); });
      storage.setJSON('hechoOverrides', overrides);
      render();
      showToast('Marcado como hecho', function(){
        var ov = storage.getJSON('hechoOverrides', {});
        pairsOf(entry).forEach(function(p){ ov = undoDone(ov, p[0], p[1]); });
        storage.setJSON('hechoOverrides', ov);
        render();
      });
    }

    function deshacerDesdeHechos(itemId, accionId){
      var overrides = storage.getJSON('hechoOverrides', {});
      overrides = undoDone(overrides, itemId, accionId);
      storage.setJSON('hechoOverrides', overrides);
      render();
    }

    function cardHTML(entry){
      var badge = '';
      if (entry.nivel === 2) badge = '<span class="badge warn">⚠️ hora sin confirmar</span>';
      if (entry.nivel === 3) badge = '<span class="badge watch">👀 vigilar apertura</span>';
      if (entry.nivel === 4) badge = '<span class="badge watch">📌 reservar ya</span>';

      var esGrupo = !!entry.tramos;
      var titulo = esGrupo ? etiquetaAccion(entry.accionId) : (etiquetaAccion(entry.accionId) + ' · ' + entry.nombre);
      var tramosHTML = esGrupo
        ? '<ul class="tramos">' + entry.tramos.map(function(t){ return '<li>' + esc(t.nombre) + '</li>'; }).join('') + '</ul>'
        : '';

      var reglaHTML = entry.accion.reglaApertura ? '<p class="regla">' + esc(entry.accion.reglaApertura) + '</p>' : '';
      var url = entry.accion.dondeReservar || entry.accion.fuente;
      var linkHTML = url ? '<a class="btn" href="' + esc(url) + '" target="_blank" rel="noopener">Ir a reservar ↗</a>' : '';
      var accionHTML = '<button class="primary" data-idx="' + entry._idx + '">Marcar como hecho</button>';

      var rightHTML = '';
      if (entry.nivel === 1 || entry.nivel === 2) {
        var c = formatCountdown(entry.minutosHastaApertura);
        rightHTML = '<div class="countdown-big">' + esc(c.big) + '<span class="countdown-unit">' + esc(c.unit) + '</span></div>';
        if (entry.accion.horaConfirmada && entry.horas) {
          var md = entry.horas['Europe/Madrid'].split(' ');
          var jst = entry.horas['Asia/Tokyo'].split(' ');
          rightHTML += '<div class="fecha-corta">' + formatFechaCorta(md[0]) + ' · ' + md[1] + '</div>' +
            '<div class="hora-jst">' + formatFechaCorta(jst[0]) + ' · ' + jst[1] + ' JST</div>';
        } else {
          // Decisión 2026-09-16 (punto 3): aunque la hora JST no esté
          // confirmada, SÍ se calcula la conversión real a Madrid desde la
          // mejor estimación disponible (la hora conocida, o 00:00 JST si
          // no hay ninguna — accionAbreEnUtc en model.js ya hace ese
          // fallback). Mostrar la fecha JST sin convertir daba una fecha de
          // Madrid equivocada por delante/detrás de un día.
          var mdW = entry.horas['Europe/Madrid'].split(' ');
          var jstW = entry.horas['Asia/Tokyo'].split(' ');
          rightHTML += '<div class="fecha-corta warn">' + formatFechaCorta(mdW[0]) + ' · desde ' + mdW[1] + ' ⚠️</div>' +
            '<div class="hora-jst">' + formatFechaCorta(jstW[0]) + ' JST</div>';
        }
      }

      return '<div class="card">' +
        '<div class="card-left">' +
          '<h3>' + esc(titulo) + '</h3>' + tramosHTML + badge +
          reglaHTML +
          '<div class="actions">' + linkHTML + accionHTML + '</div>' +
        '</div>' +
        '<div class="card-right">' + rightHTML + '</div>' +
        '</div>';
    }

    var entryRegistry = [];
    function registerEntries(list){
      list.forEach(function(e){ e._idx = entryRegistry.length; entryRegistry.push(e); });
      return list;
    }

    function renderView(view){
      entryRegistry = [];
      var html = '';
      var conFechaAgrupado = registerEntries(agruparPorApertura(view.conFecha));
      var vigilarReg = registerEntries(view.vigilar);
      var reservarYaReg = registerEntries(view.reservarYa);

      if (!conFechaAgrupado.length && !vigilarReg.length && !reservarYaReg.length) {
        html += '<p class="empty">Nada pendiente. 🎉</p>';
      }
      if (conFechaAgrupado.length) {
        html += '<section><h2>Próximo a abrir</h2>' + conFechaAgrupado.map(cardHTML).join('') + '</section>';
      }
      if (vigilarReg.length) {
        html += '<section><h2>Vigilar apertura</h2>' + vigilarReg.map(cardHTML).join('') + '</section>';
      }
      if (reservarYaReg.length) {
        html += '<section><h2>Reservar ya, sin fecha</h2>' + reservarYaReg.map(cardHTML).join('') + '</section>';
      }
      if (view.hechos.length) {
        html += '<details open><summary>✅ Ya hecho (' + view.hechos.length + ')</summary>' +
          view.hechos.map(function(h){
            var puedeDeshacer = h._overridden;
            return '<div class="hecho-row"><span>' + esc(h.nombre) + ' · ' + esc(etiquetaAccion(h.accionId)) + '</span>' +
              (puedeDeshacer ? '<button class="link" data-undo-item="' + esc(h.itemId) + '" data-undo-accion="' + esc(h.accionId) + '">Deshacer</button>' : '') +
              '</div>';
          }).join('') +
          '</details>';
      }
      app.innerHTML = html;

      app.querySelectorAll('button[data-idx]').forEach(function(btn){
        btn.addEventListener('click', function(){ marcarHecho(entryRegistry[Number(btn.getAttribute('data-idx'))]); });
      });
      app.querySelectorAll('button[data-undo-item]').forEach(function(btn){
        btn.addEventListener('click', function(){
          deshacerDesdeHechos(btn.getAttribute('data-undo-item'), btn.getAttribute('data-undo-accion'));
        });
      });
    }

    function renderSinDatos(){
      app.innerHTML = '<div class="devnote">' +
        '<p><strong>Modo desarrollo: sin datos</strong></p>' +
        '<p>No se encontró <code>import/v3-migrated-preview.json</code>. Ese fichero tiene datos ' +
        'reales del viaje y nunca se publica (está en <code>.gitignore</code>): solo existe en tu ' +
        'servidor local tras ejecutar el importador.</p>' +
        '<p>Genera un volcado con <code>node tools/v3-migrate-import.js live.json</code> y sirve el ' +
        'repo con <code>.claude/serve.ps1</code> (o <code>.claude/serve-lan.ps1</code> para probar ' +
        'desde el móvil).</p>' +
        '</div>';
    }

    var itemsCache = null;
    function render(){
      if (!itemsCache) { renderSinDatos(); return; }
      var overrides = storage.getJSON('hechoOverrides', {});
      var items = applyOverrides(itemsCache, overrides);
      var view = pendientesView(items, Date.now());
      view.hechos = view.hechos.map(function(h){
        return Object.assign({}, h, { _overridden: isOverridden(overrides, h.itemId, h.accionId) });
      });
      renderView(view);
    }

    fetch('../import/v3-migrated-preview.json')
      .then(function(res){ if (!res.ok) throw new Error('sin datos'); return res.json(); })
      .then(function(items){ itemsCache = items; render(); })
      .catch(function(){ itemsCache = null; render(); });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js', { scope: './' });
    }
  </script>
</body>
</html>
